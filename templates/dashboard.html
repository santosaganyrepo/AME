<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marking Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; padding: 40px 20px; color: #333;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .welcome-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        h1 { color: #667eea; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 40px; }
        .main-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .nav-card { 
            background: #f8f9ff; padding: 40px 20px; border-radius: 15px; border: 2px solid #eef2ff;
            text-decoration: none; transition: all 0.3s; display: flex; flex-direction: column; align-items: center;
        }
        .nav-card:hover { transform: translateY(-10px); border-color: #667eea; box-shadow: 0 10px 30px rgba(102,126,234,0.2); }
        .nav-card .icon { font-size: 3em; margin-bottom: 15px; }
        .nav-card span { font-weight: bold; color: #444; font-size: 1.2em; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-item { background: #fdfdfd; padding: 20px; border-radius: 12px; border: 1px solid #eee; }
        .stat-value { display: block; font-size: 2em; font-weight: 800; color: #764ba2; }
        .stat-label { font-size: 0.8em; color: #999; text-transform: uppercase; font-weight: bold; }
        .btn-settings {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-settings:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-settings svg {
            transition: transform 0.5s ease;
        }

        .btn-settings:hover svg {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-card">
            <h1>AI Marking system</h1>

            <h2>GOD CARES HIGH SCHOOL</h2>
            
            <div class="main-nav">
                <a href="/setup-start" class="nav-card">
                    <div class="icon">📝</div>
                    <span>Mark Exams</span>
                </a>

                <a href="/students" class="nav-card">
                    <div class="icon">📊</div>
                    <span>View Marked</span>
                </a>
            </div>


            <!-- Auto-Deletion Warning Banner -->
            {% if auto_deletion_enabled %}
            <div style="background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: white; padding: 15px 25px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(255,107,107,0.3);">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="font-size: 1.5em;">⚠️</span>
                    <div>
                        <strong style="font-size: 1.1em;">Auto-Deletion Active</strong>
                        <p style="margin: 5px 0 0 0; font-size: 0.9em; opacity: 0.9;">Student answer sheets are automatically deleted after 48 hours</p>
                    </div>
                </div>
                <a href="/settings" style="background: white; color: #ee5a6f; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s;">
                    Manage
                </a>
            </div>
            {% endif %}
                
                <!-- ADD THIS NEW BUTTON -->
                <a href="/settings" class="btn-settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    System Settings
                </a>
            </div>
        </div>
    </div>
</body>
</html>

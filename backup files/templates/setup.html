<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Setup - One Time Configuration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .setup-container { max-width: 600px; margin: 50px auto; }
        .setup-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .setup-card h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
        .setup-card p { text-align: center; color: #666; margin-bottom: 30px; }
        .info-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 30px; }
        .info-box strong { color: #856404; }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <h1>🔒 Exam Setup</h1>
            <p>Configure once, capture multiple students</p>
            
            <div class="info-box">
                <strong>⚠️ Important:</strong> This information will be locked for the entire session. You only need to enter Student ID and Name for each exam after this.
            </div>
            
            <form id="setupForm">
                <div class="form-group">
                    <label for="class">Class / Form *</label>
                    <select id="class" name="class" required>
                        <option value="">Select Class</option>
                        {% for class_name in classes %}
                        <option value="{{ class_name }}">{{ class_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="exam_type">Exam Type *</label>
                    <select id="exam_type" name="exam_type" required>
                        <option value="">Select Type</option>
                        {% for exam_type in exam_types %}
                        <option value="{{ exam_type }}">{{ exam_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="term">Term *</label>
                    <select id="term" name="term" required>
                        <option value="">Select Term</option>
                        {% for term in terms %}
                        <option value="{{ term }}">{{ term }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" id="year" name="year" required value="2024" min="2020" max="2030">
                </div>
                
                <button type="submit" class="btn-primary">Lock Settings & Start Capture</button>
            </form>
            
            <div id="message" class="message" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                class: document.getElementById('class').value,
                subject: document.getElementById('subject').value,
                exam_type: document.getElementById('exam_type').value,
                term: document.getElementById('term').value,
                year: document.getElementById('year').value
            };
            
            try {
                const response = await fetch('/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = '/upload-student';
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Network error: ' + error);
            }
        });
    </script>
</body>
</html>
